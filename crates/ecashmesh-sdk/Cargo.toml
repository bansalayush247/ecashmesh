[package]
name = "ecashmesh-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Choose which of a wallet's Cashu and Fedimint sources should pay"

[lints]
workspace = true

[dependencies]
ecashmesh-core = { path = "../ecashmesh-core" }
ecashmesh-cashu = { path = "../ecashmesh-cashu" }
ecashmesh-fedimint = { path = "../ecashmesh-fedimint", default-features = false }
futures = "0.3"
# Decodes the invoice payee, to recognise a direct channel in liquidity evidence.
lightning-invoice = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
