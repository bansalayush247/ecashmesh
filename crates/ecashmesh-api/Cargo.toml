[package]
name = "ecashmesh-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local HTTP API for manually testing EcashMesh route ranking"

[lints]
workspace = true

[dependencies]
axum = "0.8"
ecashmesh-core = { path = "../ecashmesh-core" }
ecashmesh-cashu = { path = "../ecashmesh-cashu" }
ecashmesh-fedimint = { path = "../ecashmesh-fedimint" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
# Already locked through the Fedimint adapter; decodes the payee of lab invoices.
lightning-invoice = "0.33"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
base64 = "0.22"
