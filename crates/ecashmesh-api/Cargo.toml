[package]
name = "ecashmesh-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local HTTP API for manually testing EcashMesh route ranking"

[lints]
workspace = true

[dependencies]
axum = "0.8"
ecashmesh-core = { path = "../ecashmesh-core" }
ecashmesh-cashu = { path = "../ecashmesh-cashu" }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
base64 = "0.22"
