[package]
name = "ecashmesh-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local HTTP API for manually testing EcashMesh route ranking"

[lints]
workspace = true

[dependencies]
axum = "0.8"
ecashmesh-core = { path = "../ecashmesh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
