[package]
name = "ecashmesh-cashu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Cashu metadata and evidence adapter for EcashMesh"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
ecashmesh-core = { path = "../ecashmesh-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
secp256k1 = { version = "0.31", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "macros", "net", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util"] }
