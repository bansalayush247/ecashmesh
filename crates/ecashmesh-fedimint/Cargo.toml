[package]
name = "ecashmesh-fedimint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Fedimint evidence and Lightning quote adapter for EcashMesh"

[lints]
workspace = true

[dependencies]
ecashmesh-core = { path = "../ecashmesh-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
