[package]
name = "ecashmesh-fedimint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Fedimint evidence and Lightning quote adapter for EcashMesh"

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
ecashmesh-core = { path = "../ecashmesh-core" }
fedimint-bip39 = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-api-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-connectors = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-core = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-ln-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-ln-common = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-lnv2-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-lnv2-common = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-meta-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-mint-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-rocksdb = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
fedimint-wallet-client = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5.10", features = ["all"] }
tokio = { version = "1", features = ["process", "time"] }
