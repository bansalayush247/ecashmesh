[package]
name = "ecashmesh-lab-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Regtest-only pinned Fedimint topology launcher for EcashMesh"

[lints]
workspace = true

[dependencies]
anyhow = "1"
devimint = { git = "https://github.com/fedimint/fedimint.git", tag = "v0.12.1" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
